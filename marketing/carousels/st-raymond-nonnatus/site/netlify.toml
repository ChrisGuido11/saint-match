# Standalone deploy for the St Raymond Nonnatus carousel asset page.
#
# This directory is self-contained: index.html, both PNG sets, both ZIPs and
# the MP4 all live here. There is no build step.
#
# CLI:  netlify deploy --dir marketing/carousels/st-raymond-nonnatus/site
# Git:  set the site's base directory to marketing/carousels/st-raymond-nonnatus/site
#
# See DEPLOY.md alongside this file for the exact commands.

[build]
  publish = "."
  command = ""

# Immutable assets: the filenames are stable and the bytes only change when the
# carousel is rebuilt, so cache hard and bust by redeploying under a new path.
[[headers]]
  for = "/slides/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/slides-vertical/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must revalidate so a rebuild is picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
